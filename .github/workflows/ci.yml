name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "default"
          cache-on-failure: "true"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
      - name: Fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy

      - name: Unused dependencies
        run: cargo machete

      - name: Check dependencies licences are compatible
        run: cargo deny check licenses